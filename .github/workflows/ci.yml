name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        id: ruff
        continue-on-error: true
        run: ruff check . > ruff.log 2>&1
      - name: Pytest
        id: pytest
        continue-on-error: true
        run: pytest > pytest.log 2>&1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostics
          path: |
            ruff.log
            pytest.log
      - name: Enforce validation gates
        if: always()
        run: |
          test "${{ steps.ruff.outcome }}" = "success"
          test "${{ steps.pytest.outcome }}" = "success"
