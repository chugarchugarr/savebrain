[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tro-frontier"
version = "0.2.0"
description = "TRACE + REVAL + ORO routed agent and public benchmark adapters"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Joseph Lerma" }]
dependencies = [
  "openai>=1.68.0,<3",
]

[project.optional-dependencies]
dev = [
  "harbor>=0.20,<0.21",
  "pytest>=8.0,<9",
  "ruff>=0.9,<1",
]
harbor = [
  "harbor>=0.20,<0.21",
]

[project.scripts]
tro-frontier = "tro_frontier.cli:main"
tro-swebench = "tro_frontier.benchmarks.swebench:main"
tro-ablate = "tro_frontier.ablation:main"
tro-sweep = "tro_frontier.sweep:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP037"]
